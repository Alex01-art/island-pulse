name: Collecte des stats

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/islands.json"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les stats Epic
        run: node scripts/collect.mjs
      - name: Enregistrer
        run: |
          git config user.name "island-pulse-bot"
          git config user.email "island-pulse-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "stats $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
